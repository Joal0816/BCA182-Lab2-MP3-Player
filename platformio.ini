; PlatformIO Project Configuration File
;
; Laboratory Activity 2 - Personal MP3 Player
; Target: STM32F407ZGT6 (black_f407zg) + FreeRTOS + STM32Cube HAL
; Native environment for Unity unit tests

[platformio]
default_envs = black_f407zg

[env]
test_framework = unity

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = stm32cube
extra_scripts = pre:add_hardfloat.py

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F407xx
    -DHSE_VALUE=8000000
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    -Iinclude

lib_deps =
    bojit/PlatformIO-FreeRTOS@^2.1.4

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -Iinclude
    -Isrc
    -DNATIVE_TEST
test_build_src = yes
build_src_filter =
    +<button_decoder.cpp>
    +<player_state.cpp>
    +<volume_control.cpp>
    +<songs.cpp>
